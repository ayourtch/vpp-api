[package]
name = "vpp-api-transport"
version = "0.1.6"
authors = ["Andrew Yourtchenko <ayourtch@gmail.com>"]
edition = "2018"
description = "fd.io VPP API transport over shared memory and sockets"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ayourtch/vpp-api-transport"
homepage = "https://wiki.fd.io/view/VPP"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# "shm" enables the shared-memory transport, which links against
# libvppapiclient.so (set VPP_LIB_DIR if it is not in the default
# location). Disable default features for a pure-Rust AF_UNIX-only
# build with no native VPP library dependency:
#   vpp-api-transport = { ..., default-features = false }
default = ["shm"]
shm = []

[lib]
name = "vpp_api_transport"
path = "src/lib.rs"

[[example]]
name = "vpp-api-transport-test"

[dependencies]
lazy_static = "1.4.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.2.1"
vpp-api-message = {path = "../vpp-api-message" }
log = "0.4.14"

[dev-dependencies]
serde_json = "1.0"
serde_yaml = "0.8"
clap = { version = "3.0.0", features = [ "derive" ] }

[build-dependencies]
bindgen = "0.71"
